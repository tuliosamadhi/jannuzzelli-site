ions, repositioning, organizational realignment and M&A structuring.", "Design decision frameworks and negotiation architectures that let leadership teams structure complex choices, align stakeholders and execute under uncertainty.", "Built the commercial engine end to end: signal-based account selection from public evidence, one-to-one multi-channel outreach, discovery conversations, pricing, proposal terms and IP protection.", "Negotiated a technical-partner pilot and declined a lead-referral structure that would have reduced the practice to an intermediary — protecting value capture and independence.", "Developed proprietary methodology and AI-assisted analytical workflows; bilingual go-to-market (PT/EN)."], "tags": ["strategy", "sales", "ai", "intl"]}, {"t": "Strategic Marketing Advisor (hybrid executive role)", "o": "by Jill Diamond — New York, USA", "p": "Feb 2020 – Dec 2022", "pl": "New York · Brazil", "b": ["Worked directly with the CEO across Brazil and the United States: business planning, strategic repositioning, growth strategy and partnership evaluation.", "Led strategic coordination and delivery of the new digital platform, integrating marketing, communication and business strategy for scalability and long-term value.", "With his help, a series of digital programs was rolled out over 18 months (per the client’s recommendation).", "Took part in U.S.-based corporate training programs on innovation, marketing and business development; operated across strategy and execution in cross-border conditions."], "tags": ["strategy", "intl", "sales"]}, {"t": "Founder & CEO — Strategic Innovation, R&D&I, Corporate Bridging", "o": "Drarian", "p": "Aug 2013 – Dec 2019", "pl": "Greater São Paulo", "b": ["Created a structured executive bridge between academia, corporations and investors, after leading a deep-tech initiative with INOVA UNICAMP on applied nanotechnology in wood.", "Orchestrated innovation ecosystems with USP, UNICAMP, UNIFESP and UNESP, technology institu document.addEventListener('click',e=>{

/* ---- Noise -> structure ---- */
const cvs=$('#cv'),g=cvs.getContext('2d');const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,P=[],ordered=false,vis=true;const N=63;
function layout(){ // layered decision structure: 1 / 3 / 9 / 18 / ... nodes
 const rows=[1,3,6,9,12,14,18];const T=[];const top=H*.14,bot=H*.86;
 rows.forEach((n,ri)=>{const y=top+(bot-top)*ri/(rows.length-1);for(let i=0;i<n;i++){const span=Math.min(W*.9,60+n*W*.06);T.push({x:W/2+(n===1?0:(i/(n-1)-.5)*span),y,r:ri})}});
 return T.slice(0,N);
}
function size(){const r=cvs.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cvs.width=W*d;cvs.height=H*d;g.setTransform(d,0,0,d,0,0);
 const T=layout();if(!P.length)P=Array.from({length:N},(_,i)=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5}));
 P.forEach((p,i)=>{p.t=T[i]||{x:W/2,y:H/2,r:0}});}
function setTog(){const x=D[code].extra;const b=$('#tog');b.textContent=ordered?x.noise:x.structure;b.setAttribute('aria-pressed',ordered)}
$('#tog').addEventListener('click',()=>{ordered=!ordered;setTog();if(reduce)draw()});
function draw(){g.clearRect(0,0,W,H);const k=ordered;
 if(k){g.strokeStyle='rgba(46,195,242,.13)';g.lineWidth=1;P.forEach(a=>P.forEach(b=>{if(b.t.r===a.t.r+1&&Math.abs(a.t.x-b.t.x)<W*.22){g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}}))}
 P.forEach(p=>{g.fillStyle=k?'rgba(46,195,242,.95)':'rgba(155,176,193,.6)';g.beginPath();g.arc(p.x,p.y,k?3.4:2.2,0,6.283);g.fill()})}
function step(){if(!vis){requestAnimationFrame(step);return}
 P.forEach(p=>{if(ordered){p.x+=(p.t.x-p.x)*.06;p.y+=(p.t.y-p.y)*.06}else{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}});
 draw();requestAnimationFrame(step)}
new IntersectionObserver(es=>{vis=es[0].isIntersecting}).observe(cvs);
addEventListener('resize',()=>{size();if(reduce)draw()});
render();size();if(reduce){P.forEach(p=>{p.x=p.t.x;p.y=p.t.y});ordered=true;setTog();draw()}else{step()}
